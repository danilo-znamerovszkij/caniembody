name: CI
on:
  pull_request:
  push: { branches: [main] }
jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history: page dates and changelogs come from git
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Schema, referential integrity, epistemic contract
        run: npm run validate
      - run: npx astro build && node scripts/redirects.ts
      - name: SEO audit (titles, canonicals, h1, sitemap, internal links)
        run: node scripts/seo-audit.ts
      - name: Evidence links
        run: npm run check-links
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }
  lighthouse:
    needs: validate-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
