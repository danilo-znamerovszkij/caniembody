robot: agilex-piper
policy: diffusion
state: works-with-caveats
framework: lerobot
caveats:
  - "Community-reported only; not documented upstream or maintainer-tested."
  - "The only physical run uses PCD-LeRobot, a research codebase with its own vendored LeRobot copy (pyproject version 0.3.4) and its own piper robot type; LeRobot has no built-in Piper robot type."
  - "The unmodified Diffusion Policy baseline succeeded 15% of the time on one bowl-on-plate task (50 demonstrations, one ROS RGB camera, 10 Hz inference); the trial count is not stated."
capabilities:
  train:
    state: works
    evidence: [ev-hub-aachen-diffusion, ev-pcd-lerobot-piper-diffusion]
  inference_real:
    state: works-with-caveats
    notes: "15% baseline success on one task; trial count not stated."
    evidence: [ev-pcd-lerobot-piper-diffusion]
  teleop_record:
    state: works
    notes: "Leader-follower recording with --robot.type=piper_follower and --teleop.type=piper_leader in the PCD-LeRobot codebase."
    evidence: [ev-pcd-lerobot-piper-diffusion]
evidence:
