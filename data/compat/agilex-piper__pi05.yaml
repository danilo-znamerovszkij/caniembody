robot: agilex-piper
policy: pi05
state: works-with-caveats
framework: openpi
caveats:
  - "The vendor-documented route is AgileX's own openpi fork (openpi-agilex, JAX, ROS 2) on the bimanual Cobot Magic (two PiPER arms, three cameras), not a single PiPER arm and not LeRobot."
  - "AgileX documents the fine-tuning and inference workflow but publishes no PiPER success rates or released PiPER checkpoint."
capabilities:
  train:
    state: works
    notes: "Vendor: π0.5 fine-tuning configs pi05_aloha / pi05_aloha_lora for cobot_magic data collected with agilexrobotics/data_tools. Community: LeRobot pi05 checkpoint trained on single-arm Piper data."
    evidence: [ev-openpi-agilex-readme, ev-hub-qualia-pi05]
  inference_real:
    state: works
    notes: "Vendor: serve the fine-tuned checkpoint with openpi's serve_policy.py and run scripts/aloha_inference-joint-ros2.py against dual PiPER arms."
    evidence: [ev-openpi-agilex-readme, ev-openpi-agilex-configs]
