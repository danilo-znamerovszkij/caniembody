    url: https://arxiv.org/abs/2502.19645
    date: 2025-02-27
    verified_on: 2026-10-24
    summary: "OpenVLA-OFT paper fine-tunes OpenVLA with OFT+ on four real ALOHA tasks (fold shorts, fold shirt, scoop X into bowl, put X into pot); ALOHA here is the original ALOHA of Zhao et al. 2023 (ref. [56], arXiv 2304.13705), not ALOHA 2."
