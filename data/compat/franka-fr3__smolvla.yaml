robot: franka-fr3
policy: smolvla
state: works-with-caveats
framework: lerobot
caveats:
  - "Community-reported only (CRISP paper authors); not documented upstream or maintainer-tested."
  - "Runs through the third-party CRISP ROS 2 controllers and crisp_gym interface; LeRobot v0.6.1 has no native FR3 robot type."
  - "SmolVLA ran at approximately 10 Hz and outputs end-effector target poses tracked by CRISP's Cartesian impedance controllers; the paper reports no task success rates."
capabilities:
  train:
    state: works
    notes: "Data recorded on the FR3 in LeRobotDataset format and trained with LeRobot's training scripts."
    evidence: [ev-lerobot-issue-1567-crisp, ev-crisp-paper-deploy, ev-phail-card-smolvla]
  inference_real:
    state: works-with-caveats
    evidence: [ev-crisp-paper-deploy, ev-crisp-paper-fr3, ev-phail-card-smolvla]
