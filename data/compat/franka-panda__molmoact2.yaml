    verified_on: 2026-10-24
    summary: "Upstream MolmoAct2-DROID HTTP inference server (allenai/MolmoAct2-DROID, norm tag franka_droid). It takes an external + wrist image and an 8-D joint+gripper state."
    quote: "MolmoAct2-DROID inference server."
  - id: ev-lerobot-molmoact2-doc
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/molmoact2.mdx
