robot: franka-panda
policy: molmoact2
state: works-with-caveats
framework: molmoact2
caveats:
  - "Evidence is for the DROID setup (Franka, external + wrist camera, 15-step chunks at DROID's 15 Hz). The paper says 'DROID setup' without naming the arm model. The DROID platform is Panda-based, but its software also accepts an FR3."
  - "The upstream repo ships the MolmoAct2-DROID inference server (examples/droid/host_server_droid.py) but not the robot-side client."
capabilities:
  train:
    state: works
    evidence: [ev-molmoact2-paper-droid-ft]
  inference_real:
    state: works
    notes: "Zero-shot real-world DROID evaluation: five kitchen tasks x three spatial variants, 87.1% (vs. MolmoBot and π0 baselines)."
    evidence: [ev-molmoact2-paper-droid-real, ev-molmoact2-droid-server, ev-lerobot-molmoact2-doc, ev-droid-paper]
evidence:
  - id: ev-molmoact2-paper-droid-real
    tier: upstream-documented
    type: paper
    url: https://arxiv.org/abs/2605.02881v2
    date: 2026-05-08
    verified_on: 2026-10-24
    summary: "MolmoAct2 paper, Sec. 6.2 / App. C.2: MolmoAct2-DROID is evaluated zero-shot on a real DROID setup in novel scenes, reaching 87.1%."
    quote: "In real-world evaluation on the DROID setup, which is substantially more out-of-distribution given the random camera initialization and entirely novel scenes and objects relative to the DROID dataset (Khazatsky et al., 2024), MolmoAct2 again attains the highest performance, reaching 87.1%"
  - id: ev-molmoact2-paper-droid-ft
    tier: upstream-documented
    type: paper
    url: https://arxiv.org/abs/2605.02881v2
    date: 2026-05-08
    verified_on: 2026-10-24
    summary: "MolmoAct2 paper: the MolmoAct2-DROID checkpoint is fine-tuned on a quality-filtered DROID mixture."
    quote: "The MolmoAct2-DROID checkpoint is fine-tuned on the filtered DROID mixture."
  - id: ev-molmoact2-droid-server
    tier: upstream-documented
    type: source-code
