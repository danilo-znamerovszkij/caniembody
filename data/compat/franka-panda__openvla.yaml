state: works-with-caveats
framework: openvla
caveats:
  - "Panda results come from fine-tuning (10-150 demonstrations per task), not out-of-the-box use. The OpenVLA repo ships no Franka controller or deployment script."
  - "OpenVLA takes a single image and predicts single-step actions. The Franka setups ran 5 Hz (Franka-Tabletop) and 15 Hz (Franka-DROID) non-blocking controllers."
