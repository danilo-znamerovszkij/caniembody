robot: franka-panda
policy: pi05
state: works-with-caveats
framework: openpi
caveats:
  - "Documented for the DROID platform (Panda, ZED 2 exterior + ZED Mini wrist cameras, DROID control laptop/NUC), not for an arbitrary Panda setup. The policy uses one exterior camera plus the wrist camera."
  - "Inference runs on a remote GPU policy server (~RTX 4090). openpi notes that 0.5-1 s latency per action chunk is normal and that the policy fails on more complex manipulation tasks."
capabilities:
  train:
    state: works
    notes: "openpi documents fine-tuning π0.5 on a custom DROID dataset."
    evidence: [ev-openpi-readme-pi05-droid]
  inference_real:
    state: works
    evidence: [ev-openpi-droid-example, ev-ki-paper-droid, ev-droid-paper]
