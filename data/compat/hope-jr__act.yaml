    summary: "The Hope-JR page trains an ACT policy on a hope_jr_hand dataset (outputs/train/hopejr_hand)."
    quote: "--policy.type=act \\\n  --output_dir=outputs/train/hopejr_hand"
  - id: ev-lerobot-hopejr-experimental
    tier: upstream-documented
