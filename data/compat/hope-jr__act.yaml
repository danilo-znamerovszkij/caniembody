robot: hope-jr
policy: act
state: partial
partial_scope: "Training ACT on data recorded with the Hope-JR hand (robot type hope_jr_hand) is documented upstream and labelled experimental; the arm is not covered. The page's evaluation step passes --policy.path to lerobot-record, but lerobot-record in v0.6.1 requires --teleop.type and has no policy option (policies are deployed with lerobot-rollout), so on-robot inference is not validly documented."
framework: lerobot
framework_version_tested: "0.6.1"
capabilities:
  train:
    state: works
    notes: "Documented for hope_jr_hand only, with a homunculus_glove teleoperator for recording; upstream calls Record/Replay/Train experimental."
    evidence: [ev-lerobot-hopejr-train, ev-lerobot-hopejr-experimental]
  teleop_record:
    state: works
    evidence: [ev-lerobot-hopejr-experimental]
caveats:
  - "Upstream states that Record, Replay and Train with Hope-JR are still experimental."
evidence:
