robot: omx
policy: groot-n1-7
state: works-with-caveats
caveats:
  - "Community-reported only; not documented upstream or maintainer-tested."
  - "Trained and served with NVIDIA's Isaac-GR00T stack (NEW_EMBODIMENT tag, GR00T policy server), not LeRobot's groot policy; the dataset uses ROBOTIS's robot_type string omx_f rather than LeRobot's omx_follower."
  - "The authors report that the single top-down-camera model closed the gripper before reaching the object during real-robot deployment (height perception); their 2-camera successor adds a wrist camera to address it."
framework: isaac-groot
