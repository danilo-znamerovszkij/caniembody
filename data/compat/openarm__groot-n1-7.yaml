robot: openarm
policy: groot-n1-7
state: works-with-caveats
framework: isaac-groot
caveats:
  - "Documented only in Enactic's fork of Isaac-GR00T (branch n1.7-release-ga-openarm, a single commit ahead of NVIDIA main as of 2026-10-23), not in NVIDIA's Isaac-GR00T or in LeRobot."
  - "Bimanual OpenArm only (OPENARM_BIMANUAL_REL tag, 16-D joint actions, both wrist cameras required); robot control runs in Enactic's Dora graph, which talks to the policy server over a UNIX socket."
  - "Isaac-GR00T's scripts/deployment tools (TensorRT, standalone inference) do not apply OpenArm camera profiles and are not supported for OpenArm checkpoints in this release."
  - "No on-robot success rates are published; the vendor checkpoint card lists inputs, outputs and training tasks only."
capabilities:
  train:
    state: works
    notes: "Fine-tune nvidia/GR00T-N1.7-3B on OpenArm recordings converted with enactic/openarm_dataset (LeRobot v2.1 + modality.json); vendor checkpoint enactic/GR00T-N1.7-openarm-2-cell-pillow trained on five pillow tasks."
    evidence: [ev-enactic-groot-openarm-train, ev-enactic-groot-openarm-card]
  inference_real:
    state: works
    notes: "Vendor-documented deployment path: openarm_server policy server (PyTorch, 32-step chunks at 30 Hz) serving dora-openarm-local-policy-server."
    evidence: [ev-enactic-groot-openarm-server, ev-enactic-groot-openarm-card]
