robot: reachy2
policy: act
state: partial
partial_scope: "Training ACT on a Reachy 2 dataset recorded with lerobot-record is documented upstream. The page's evaluation step runs lerobot-eval with --robot.* flags, but lerobot-eval in v0.6.1 evaluates in a simulation env (its config has an env field and no robot field), so on-robot inference is not validly documented."
framework: lerobot
framework_version_tested: "0.6.1"
capabilities:
  train:
    state: works
    evidence: [ev-lerobot-reachy2-train]
  teleop_record:
    state: works
    notes: "Recording uses --robot.type=reachy2 with --teleop.type=reachy2_teleoperator; the page also documents Pollen's own VR data-acquisition app."
    evidence: [ev-lerobot-reachy2-record]
