robot: rebot-b601
policy: groot-n1-7
state: works-with-caveats
caveats:
  - "Documented in NVIDIA's Isaac-GR00T repository, not through LeRobot's groot policy: the real-robot client uses Seeed's LeRobot fork plus the lerobot-robot-seeed-b601 plugin (--robot.type=seeed_b601_dm_follower), not LeRobot's native rebot_b601_follower."
  - "Covers the reBot Arm B601-DM (Damiao-motor variant); datasets must be converted from LeRobot v3 to v2 before Isaac-GR00T fine-tuning."
  - "The example landed on Isaac-GR00T main (2026-07-30) after the n1.7-release tag; it is not part of a tagged release."
framework: isaac-groot
capabilities:
  train:
    state: works
    notes: "Fine-tuned from nvidia/GR00T-N1.7-3B with --embodiment-tag NEW_EMBODIMENT; six arm joints as relative actions, gripper absolute."
    evidence: [ev-gr00t-rebot]
  inference_real:
    state: works
    notes: "Closed-loop deployment via run_gr00t_server.py plus the eval_rebot_arm_dm.py client; the README shows only open-loop plots, no closed-loop success rates."
    evidence: [ev-gr00t-rebot, ev-gr00t-rebot-client]
