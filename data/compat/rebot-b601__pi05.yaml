robot: rebot-b601
policy: pi05
state: partial
partial_scope: Training on reBot B601-DM data is documented by the vendor (Seeed wiki 'B601-DM with LeRobot'). The wiki's on-robot evaluation command (lerobot-record with --policy.path and no teleoperator) is rejected by the Seeed LeRobot fork the wiki installs, which directs policy deployment to lerobot-rollout, so on-robot inference is not validly documented. Public checkpoints trained on B601-DM data also exist.
framework: lerobot
capabilities:
  train:
    state: works
    evidence:
    - ev-seeed-wiki-b601-dm-lerobot
    - ev-hub-tinjyuu-pi05-rebot
    - ev-hub-qualia-pi05-rebot
