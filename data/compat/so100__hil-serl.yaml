robot: so100
policy: hil-serl
state: works-with-caveats
framework: lerobot
framework_version_tested: 0.6.1
caveats:
- 'The guide''s documented intervention path is a gamepad or keyboard in end-effector space (needs a URDF); using an SO leader arm as the intervention device is reported broken in open issue #2952, not
  yet confirmed or fixed by maintainers.'
- src/lerobot/configs/train_config_hilserl_so100.json is referenced by the guide but is not in the v0.6.1 source tree; the example configs are hosted in the aractingi/lerobot-example-config-files dataset,
  and its env_config_so100.json still names the removed so100_follower_end_effector robot type.
capabilities:
  train:
    state: works
    notes: Online RL on the physical robot (actor/learner).
    evidence:
    - ev-lerobot-hilserl-learner
  inference_real:
    state: works
    evidence:
    - ev-lerobot-hilserl-learner
  teleop_record:
    state: works-with-caveats
    notes: Gamepad/keyboard documented; SO leader as intervention device reported broken (#2952).
    evidence:
    - ev-lerobot-hilserl-doc
    - ev-gh-lerobot-2952
