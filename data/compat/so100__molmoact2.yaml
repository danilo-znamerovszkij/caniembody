robot: so100
policy: molmoact2
state: works-with-caveats
framework: lerobot
framework_version_tested: 0.6.1
caveats:
- 'The MolmoAct2-SO100_101 weights expect the pre-LeRobot-0.5.0 joint calibration convention: lerobot/MolmoAct2-SO100_101-LeRobot includes the frame correction, but self-converted or fine-tuned checkpoints
  must set joint_signs/joint_offsets or the arm may move in the wrong direction.'
- Camera keys must be renamed to cam0/cam1 (--rename_map) to match the checkpoint.
capabilities:
  inference_real:
    state: works-with-caveats
    evidence:
    - ev-lerobot-molmoact2-doc
    - ev-lerobot-molmoact2-calib
    - ev-molmoact2-so100-101-card
  train:
    state: works-with-caveats
    notes: Fine-tuning from the SO-100/101 checkpoint needs the same joint frame transform.
    evidence:
    - ev-lerobot-molmoact2-calib
    - ev-molmoact2-so100-101-card
