caveats:
  - "Trossen labels its openpi tutorial experimental, with minimal testing on the Trossen AI setup."
  - "Fine-tuning is required (the π0 base mixture has no Trossen AI data); in the vendor's tests the 50-episode fine-tune failed on a different block size/colour, a wooden block, and under disturbances."
  - "Uses Trossen's openpi fork, which trains on LeRobot Dataset v2 (LeRobot v0.1.0); v3.0 datasets are not compatible with that training pipeline."
