robot: trossen-widowx
policy: pi05
state: works-with-caveats
framework: lerobot
caveats:
  - "Trossen recommends LeRobot async inference (policy server + robot client) for π0.5; synchronous lerobot-record runs the policy in the control loop, which large VLAs are often too slow for."
  - "Needs the lerobot[pi] extra (transformers/peft), which the plugin's base install omits."
  - "Vendor on-robot results are qualitative so far (no published success-rate counts)."
capabilities:
  train:
    state: works
    evidence: [ev-trossen-pi05-lerobot-card, ev-trossen-pi05-pour-card]
  inference_real:
    state: works
    evidence: [ev-trossen-plugin-readme, ev-trossen-pi05-lerobot-card, ev-trossen-pi05-pour-card]
