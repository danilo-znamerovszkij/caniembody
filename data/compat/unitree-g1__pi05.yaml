robot: unitree-g1
policy: pi05
state: works
framework: lerobot
framework_version_tested: "0.6.1"
capabilities:
  train:
    state: works
    notes: "Upstream fine-tunes from lerobot/pi05_base on a G1 dataset recorded with the Homunculus exoskeleton (bfloat16, gradient checkpointing, --policy.device=cuda)."
    evidence: [ev-lerobot-g1-train, ev-unitree-il-pi05, ev-hub-xiaopengwu-pi05-g1]
  inference_real:
    state: works
    notes: "Deployed with lerobot-rollout and --inference.type=rtc on --robot.is_simulation=false. Walking is handled by a separate locomotion controller chosen with --robot.controller (HolosomaLocomotionController in the documented command; GrootLocomotionController is also supported); the page does not present π0.5 as the walking controller."
    evidence: [ev-lerobot-g1-rollout]
  teleop_record:
    state: works
    notes: "The documented recording command runs in MuJoCo (--robot.is_simulation=true) with the Homunculus exoskeleton or a joystick."
    evidence: [ev-lerobot-g1-intro]
