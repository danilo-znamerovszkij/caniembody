robot: widowx-250
policy: openvla-oft
state: works-with-caveats
framework: openvla-oft
caveats:
  - "The WidowX result is an appendix experiment: OpenVLA-OFT (without FiLM) trained on all of BridgeData V2 and evaluated on a subset of OpenVLA's Bridge tasks (69.2% vs. 65.8% for OpenVLA)."
  - "The openvla-oft repo ships fine-tuning and evaluation code only for LIBERO and ALOHA. It has no Bridge/WidowX config, deployment script or released WidowX checkpoint."
capabilities:
  train:
    state: works
    evidence: [ev-oft-paper-bridge]
  inference_real:
    state: works
    evidence: [ev-oft-paper-bridge, ev-bridgev2-paper]
