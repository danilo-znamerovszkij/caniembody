    summary: "OpenVLA-OFT paper, Appendix (Scaling up to BridgeData V2): OFT is trained on BridgeData V2 and evaluated on real WidowX tasks from OpenVLA's evaluation suite, scoring 69.2% on average vs. 65.8% for OpenVLA."
    quote: "Specifically, we train OpenVLA-OFT (without FiLM) on the BridgeData V2 dataset [52], which contains 50,365 real WidowX robot demonstrations (25× more than the four LIBERO task suites combined)."
