    tier: upstream-documented
    type: paper
    url: https://arxiv.org/abs/2510.10274
    date: 2025-10-11
    verified_on: 2026-10-24
    summary: "X-VLA paper, Appendix J: X-VLA-0.9B fine-tuned on BridgeData is deployed on a real WidowX for pick-and-place, with each task evaluated 10 times."
    quote: "WidowX for pick-and-place experiments. Specifically, X-VLA-0.9B finetuned on BridgeData is directly deployed to evaluate its ability to perform robust manipulation on a compact platform."
  - id: ev-xvla-paper-realworld
    tier: upstream-documented
