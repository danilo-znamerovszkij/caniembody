robot: widowx-250
policy: xvla
state: works-with-caveats
framework: x-vla
caveats:
  - "The paper says only 'WidowX' following the BridgeData V2 benchmark. It identifies the arm through BridgeData V2 (a WidowX 250), not by model name."
  - "X-VLA's repo provides an inference server but no WidowX robot client. Its released WidowX checkpoints (2toINF/X-VLA-WidowX, lerobot/xvla-widowx) are labelled for the SimplerEnv benchmark, and LeRobot has no WidowX 250 robot type."
capabilities:
  train:
    state: works
    evidence: [ev-xvla-paper-widowx, ev-xvla-readme-widowx]
  inference_real:
    state: works
    notes: "Real-world WidowX pick-and-place, five tasks (visual/motion/physical/semantic generalization), 10 trials each."
    evidence: [ev-xvla-paper-widowx, ev-xvla-paper-realworld]
  inference_sim:
    state: works
    notes: "SimplerEnv WidowX (simulation)."
    evidence: [ev-xvla-readme-widowx, ev-lerobot-xvla-doc]
evidence:
