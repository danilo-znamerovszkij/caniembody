id: apple-m-32gb
name: Apple Silicon 32 GB
class: apple-silicon
memory_gb: 32
unified: true
arch: Apple M-series
notes: 'A memory class, not a single chip: any M-series Mac with 32 GB unified memory (e.g. M4 configured to 32GB in the 2024 Mac mini). Chip generation (M1–M5) and variant (base/Pro/Max/Ultra, GPU core count) change inference speed substantially, so runs on this target must record the exact chip in platform.chip. PyTorch uses the MPS backend; unified memory is shared with macOS, so usable model memory is lower than 32 GB.'
verified_on: '2026-10-24'
