id: cpu-only
name: CPU only (no accelerator)
class: cpu-only
memory_gb: 0
notes: 'memory_gb is 0 because there is no dedicated accelerator memory: models run from system RAM, which varies per machine. CPU model, core count and RAM change results by large factors, so runs on this target must record the CPU in platform.cpu (or platform.chip) and the RAM size.'
