id: jetson-agx-orin-64gb
name: NVIDIA Jetson AGX Orin 64GB
aliases:
- Jetson AGX Orin Developer Kit
class: edge
memory_gb: 64
unified: true
arch: Ampere (2048 CUDA cores, 64 Tensor Cores)
ai_tops: 275 TOPS
power_w: 15W - 60W (nvpmodel modes 15W / 30W / 50W / MAXN)
notes: AGX Orin 64GB module / developer kit. Distinct from AGX Orin 32GB (fewer cores, 40W max mode) and AGX Orin Industrial. Of the Orin modules in NVIDIA's power-mode tables, only the AGX Orin 64GB has a 50W nvpmodel mode. Record power mode with every run. 64 GB is unified memory shared with the OS.
verified_on: '2026-10-24'
