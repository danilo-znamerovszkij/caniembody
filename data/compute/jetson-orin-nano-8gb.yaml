id: jetson-orin-nano-8gb
name: NVIDIA Jetson Orin Nano 8GB (Super)
aliases:
- Jetson Orin Nano Super
- Orin Nano Super Developer Kit
- Jetson Orin Nano 8GB
class: edge
memory_gb: 8
unified: true
arch: Ampere (1024 CUDA cores, 32 Tensor Cores)
ai_tops: 67 INT8 TOPS (Super Developer Kit; up from 40 TOPS before the JetPack 6.2 Super update)
power_w: 7W–25W (MAXN_SUPER mode has no fixed power budget)
notes: 'One entry for the Orin Nano 8GB module and its developer kit. The ''Super'' developer kit is the same hardware: JetPack 6.2+ adds the 25W and MAXN_SUPER power modes (MAXN_SUPER only when flashed with the jetson-orin-nano-devkit-super configuration), raising the headline from 40 to 67 TOPS and memory bandwidth from 68 to 102 GB/s. Power mode and clock pinning (jetson_clocks) change inference latency materially, so runs on this target must record platform.power_mode and the JetPack version. 8 GB is unified memory shared with the OS and CPU.'
verified_on: '2026-10-24'
