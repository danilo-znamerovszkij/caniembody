id: jetson-orin-nx-16gb
name: NVIDIA Jetson Orin NX 16GB
class: edge
memory_gb: 16
unified: true
arch: Ampere (1024 CUDA cores, 32 Tensor Cores)
ai_tops: 157 TOPS (with JetPack 6.2 Super mode)
power_w: 10W - 15W - 25W - 40W
notes: Module (needs a carrier board). 157 TOPS and the 40W mode require the JetPack 6.2+ Super modes (MAXN_SUPER, flashed with the jetson-orin-nano-devkit-super configuration); older JetPack releases cap at 25W/MAXN. Record power mode and JetPack version with every run. 16 GB is unified memory shared with the OS.
verified_on: '2026-10-24'
