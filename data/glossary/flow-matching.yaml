id: flow-matching
term: "Flow matching"
aka: ["conditional flow matching", "CFM"]
short: "A generative training method that regresses a velocity field carrying noise to data; VLAs such as π0 and SmolVLA use it to generate continuous action chunks."
body: |
  Flow matching trains a network to predict a velocity field that transports samples from a simple noise distribution to the data distribution along a chosen probability path. At inference the field is integrated with an ODE solver over a fixed number of steps. It was introduced by Lipman, Chen, Ben-Hamu, Nickel and Le in "Flow Matching for Generative Modeling" (2022), which describes it as "a simulation-free approach for training CNFs based on regressing vector fields of fixed conditional probability paths". Diffusion paths are a special case; straight optimal-transport paths are the usual choice.

  In robot policies the generated sample is an [action chunk](/glossary/action-chunking), conditioned on images, language and [proprioceptive](/glossary/proprioception) state. [π0](/policy/pi0) (Black et al., 2024) attaches a flow-matching action expert to a pretrained vision-language model. LeRobot documents flow-matching action heads for [π0.5](/policy/pi05), [SmolVLA](/policy/smolvla), [GR00T N1.7](/policy/groot-n1-7), [X-VLA](/policy/xvla), [EO-1](/policy/eo1) and [EVO-1](/policy/evo1). In LeRobot v0.6.1, π0 defaults to `num_inference_steps=10` and SmolVLA to `num_steps=10`: each chunk costs ten passes through the action network, so the step count belongs in any [inference latency](/glossary/inference-latency) figure.

  A common misconception is that flow matching and diffusion are unrelated families. The π0 paper itself calls flow matching "a variant of diffusion". The practical differences are the training target (a velocity rather than noise) and, typically, fewer integration steps at inference. Both are iterative samplers, so both pay a per-step cost on the robot, and [real-time chunking](/glossary/real-time-chunking) was designed for policies of either kind.
related: [diffusion-policy, action-chunking, vla, inference-latency, real-time-chunking]
policies: [pi0, pi05, smolvla, groot-n1-7, xvla, eo1, evo1]
