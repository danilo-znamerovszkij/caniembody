    summary: "LeRobot paper Table 2: ACT (52M) peak memory 817.4MB CPU, 462MB MPS, 211.24 MB RTX 4090, 211.24 MB A100, fp32."
    quote: "Table 2: Peak memory consumption of policy models currently supported by lerobot . All models are run in full precision (fp32). Diffusion and Flow Models are run with 10 denoising steps at inference."
