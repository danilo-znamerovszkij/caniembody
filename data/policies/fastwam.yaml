    versions: {lerobot: "0.6.1"}
    summary: LeRobot docs describe FastWAM as a World Action Model that predicts actions directly at inference.
    quote: "FastWAM keeps video modeling during training, but uses direct action prediction at inference time instead of iteratively generating future observations."
