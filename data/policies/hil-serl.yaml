id: hil-serl
name: HIL-SERL
aliases: [hilserl, Human-in-the-Loop Sample-Efficient Robotic Reinforcement Learning, gaussian_actor]
family: rl
summary: >-
  Human-in-the-loop, sample-efficient real-robot reinforcement learning: a few teleoperated demonstrations and an
  optional vision-based reward classifier bootstrap a distributed actor/learner SAC loop, with a human able to intervene
  during on-robot exploration. In LeRobot v0.6.x the trained policy is a `gaussian_actor` driven by the `sac` algorithm.
authors: UC Berkeley (Luo, Xu, Wu, Levine)
paper_url: https://arxiv.org/abs/2410.21845
backbone: Gaussian actor (tanh-squashed diagonal Gaussian head) over image + state encoders; critics live in the SAC algorithm
action_output: other
arch_source_ref: ev-lerobot-gaussian-actor-config
license: Apache-2.0 (LeRobot implementation)
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    policy_type: gaussian_actor
    docs_url: https://huggingface.co/docs/lerobot/hilserl
    note: >-
      v0.6.0 rebuilt the RL stack: the policy is now `--policy.type=gaussian_actor` (policy.type="gaussian_actor" in the
      JSON train config) with a top-level `algorithm` block of type "sac"; from v0.3.2 through v0.5.1 the policy type was
      `sac`. Training runs as two processes, `python -m lerobot.rl.learner` and `python -m lerobot.rl.actor`. An optional
      reward classifier (type "reward_classifier", lerobot/rewards/classifier) predicts success from camera images.
      v0.3.2 is the earliest tagged LeRobot release and already ships the `sac` policy and HIL-SERL guide; the only earlier
      PyPI release (0.1.0, 2024-03) predates the HIL-SERL paper.
    source_ref: ev-lerobot-hilserl-docs-policy
requirements:
  train:
    condition: >-
      The LeRobot compute hardware guide gives no VRAM figure for RL: its RL row (still labelled `sac`, the pre-v0.6.0
      type name) reads "config-dep." and points to the HIL-SERL guide. The HIL-SERL guide lists "A Nvidia GPU" as a
      requirement and suggests 64×64 instead of 128×128 image inputs to save GPU memory.
    source_ref: ev-lerobot-hw-guide
observation_space:
  state: robot joint state, optionally with joint velocities, motor currents and end-effector pose; code requires state or an image input
  source_ref: ev-lerobot-hilserl-docs-images
notes: >-
  The guide recommends square 128×128 (default) or 64×64 image crops. The HIL-SERL paper's core RL algorithm is RLPD.
  The LeRobot compute hardware guide still names the RL policy `sac` although v0.6.x registers `gaussian_actor`.
verified_on: 2026-10-24
sources:
  - id: ev-lerobot-hilserl-docs-policy
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/hilserl.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "HIL-SERL guide: the policy is configured with type gaussian_actor and the algorithm with type sac."
    quote: '1. Configure the policy settings (`type="gaussian_actor"`, `device`, etc.)'
  - id: ev-lerobot-hilserl-docs-images
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/hilserl.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: HIL-SERL guide recommends square 128×128 or 64×64 image inputs.
    quote: "Most vision-based policies have been validated on square inputs of either **128×128** (default) or **64×64** pixels."
  - id: ev-lerobot-gaussian-actor-config
    tier: upstream-documented
