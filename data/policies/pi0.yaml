id: pi0
name: π0
aliases: [pi0, pi_0, Pi0, π₀, lerobot/pi0_base]
family: vla
summary: >-
  Physical Intelligence's flow-matching vision-language-action model: a PaliGemma VLM plus a 300M-parameter action
  expert that predicts 50-step action chunks. Open weights via openpi; LeRobot ships a PyTorch port.
authors: Physical Intelligence
paper_url: https://arxiv.org/abs/2410.24164
params: 3300000000
params_note: "Authors state 3.3 billion (PaliGemma 3B + 300M action expert). The LeRobot paper's Table 2 lists π0 as 3.5B."
params_source_ref: ev-pi0-paper-params
backbone: PaliGemma (SigLIP + Gemma 2B), with a Gemma-300M action expert
action_output: flow-matching
action_chunking: true
rtc_compatible: true
peft_supported: true
arch_source_ref: ev-pi0-paper-arch
license: Apache-2.0
weights_license: Gemma (Hub license tag `gemma` on lerobot/pi0_base)
open_weights: true
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    policy_type: pi0
    docs_url: https://huggingface.co/docs/lerobot/pi0
    note: >-
      `pi0` is registered at v0.3.2, the first tagged LeRobot release (the only earlier PyPI release, 0.1.0 of 2024-03,
      predates π0). The v0.4.0 release notes list "Add OpenPi, Pi0 and Pi0.5" (PR #1910); the docs describe the current
      implementation as adapted from openpi. RTC per rtc.mdx; PEFT per peft_training.mdx.
    source_ref: ev-lerobot-pi0-config-v032
  openpi:
    support: upstream-repo
    repo_url: https://github.com/Physical-Intelligence/openpi
    docs_url: https://github.com/Physical-Intelligence/openpi
    note: "Official Physical Intelligence release (JAX, plus PyTorch since Sept 2025); base checkpoint gs://openpi-assets/checkpoints/pi0_base."
    source_ref: ev-openpi-readme
checkpoints:
  - hub_id: lerobot/pi0_base
    note: "LeRobot-format base model; Hub license tag gemma."
  - hub_id: lerobot/pi0_libero_base
    note: "LIBERO-trained variant. The v0.6.1 pi0 docs link lerobot/pi0_libero, which the Hub redirects here."
requirements:
  train:
    vram_gb: {min: 24, max: 40}
    batch_size: 8
    condition: >-
      Peak training VRAM at batch size 8 with AdamW (LeRobot default), "Large VLA" group (pi0, pi0_fast, pi05, xvla,
      wall_x) in the LeRobot compute hardware guide; suggested A100 40 GB+, "24 GB tight at BS 1". The guide calls its
      figures indicative, order-of-magnitude numbers, not exact predictions. Precision not stated.
    reference_time: "~4–8 h for 5 epochs on a ~45k-frame dataset at batch 4 on a single A100 40 GB (indicative, ±50%)."
    source_ref: ev-lerobot-hw-guide
  inference:
    vram_gb: {measured: 13.32}
    precision: fp32
    condition: >-
      Peak memory at inference measured by the LeRobot paper (Table 2): 13.32 GB on both RTX 4090 and A100, all models in
      full fp32 precision, 10 flow-matching denoising steps. (Same table: 4.13GB CPU-only, 97MB on Apple MPS, where
      unified memory and swap make figures unreliable per the paper.)
    source_ref: ev-lerobot-paper-mem
observation_space:
  state: proprio/state vector, padded to max_state_dim 32
  language: optional
  source_ref: ev-pi0-base-card
notes: >-
  openpi's own README (JAX/openpi runtime, not LeRobot) states single-GPU needs of >8 GB for inference, >22.5 GB for
  LoRA fine-tuning and >70 GB for full fine-tuning (ev-openpi-requirements). In LeRobot, train_expert_only=true freezes
  the VLM to reduce fine-tuning memory.
verified_on: 2026-10-24
sources:
  - id: ev-pi0-paper-params
    tier: upstream-documented
    type: paper
    url: https://arxiv.org/abs/2410.24164
    date: 2024-10-31
    verified_on: 2026-10-24
    summary: π0 paper states total parameter count (PaliGemma 3B + 300M action expert).
    quote: "We add 300M parameters for the action expert (which is initialized from scratch) for a total of 3.3 billion parameters."
  - id: ev-pi0-paper-arch
    tier: upstream-documented
    type: paper
    url: https://arxiv.org/abs/2410.24164
    date: 2024-10-31
    verified_on: 2026-10-24
    summary: π0 builds on PaliGemma and supervises action-chunk tokens with conditional flow matching (H = 50).
    quote: "During training, we supervise these action tokens using a conditional flow matching loss"
  - id: ev-lerobot-pi0-config-v032
    tier: upstream-documented
    type: source-code
    url: https://github.com/huggingface/lerobot/blob/v0.3.2/src/lerobot/policies/pi0/configuration_pi0.py
    date: 2025-08-01
    verified_on: 2026-10-24
    versions: {lerobot: "0.3.2"}
    summary: "`pi0` policy type is registered at v0.3.2 (and unchanged at v0.6.1)."
    quote: '@PreTrainedConfig.register_subclass("pi0")'
  - id: ev-lerobot-v040-notes
    tier: upstream-documented
    type: release-notes
    url: https://github.com/huggingface/lerobot/releases/tag/v0.4.0
    date: 2025-10-23
    verified_on: 2026-10-24
    versions: {lerobot: "0.4.0"}
    summary: v0.4.0 added the openpi-based Pi0 and Pi0.5 implementations.
    quote: "* Add OpenPi, Pi0 and Pi0.5 by @pkooij in https://github.com/huggingface/lerobot/pull/1910"
  - id: ev-lerobot-pi0-docs
