    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: LeRobot π0 docs; implementation adapted from openpi, Apache 2.0.
    quote: "The LeRobot implementation is adapted from their open source [OpenPI](https://github.com/Physical-Intelligence/openpi) repository."
  - id: ev-openpi-readme
    tier: upstream-documented
    type: official-docs
    url: https://github.com/Physical-Intelligence/openpi/blob/215abfb217dbac7d5f1273282331b9b1866c0479/README.md
    verified_on: 2026-10-24
