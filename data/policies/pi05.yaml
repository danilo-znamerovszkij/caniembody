    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: PI05Policy defines default PEFT (LoRA) target modules for the generic --peft.* training path.
    quote: '"""Return default PEFT target modules for PI0.5 fine-tuning."""'
  - id: ev-lerobot-pi05-docs
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/pi05.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: LeRobot π0.5 docs; state is discretized into the prompt, quantile normalization by default.
    quote: "| `observation.state`         | 8                    | discretized into 256 bins and written into the prompt   |"
  - id: ev-openpi-requirements
    tier: upstream-documented
    type: official-docs
    url: https://github.com/Physical-Intelligence/openpi/blob/215abfb217dbac7d5f1273282331b9b1866c0479/README.md
