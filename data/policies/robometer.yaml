id: robometer
name: Robometer
aliases: [ROBOMETER, Robometer-4B, lerobot/Robometer-4B]
family: reward-model
in_grid: false
summary: >-
  General-purpose video-language robotic reward model on a Qwen3-VL-4B backbone with progress, success and
  preference heads. Predicts dense per-frame task progress and success from a trajectory video and task description;
  in LeRobot it is used zero-shot (inference-only) and returns one scalar reward per sample.
authors: Anthony Liang, Jesse Zhang et al. (University of Southern California, University of Washington, Ai2, NVIDIA and others)
paper_url: https://arxiv.org/abs/2603.02115
backbone: Qwen3-VL-4B-Instruct + progress / success / preference heads
action_output: scalar-reward
arch_source_ref: ev-lerobot-robometer-docs
license: Apache-2.0 (LeRobot integration)
weights_license: Apache-2.0
open_weights: true
frameworks:
  lerobot:
    support: native
    since: "0.6.0"
    policy_type: robometer
    docs_url: https://huggingface.co/docs/lerobot/robometer
    note: >-
      A reward model, not a policy: lives in src/lerobot/rewards/robometer, registered with
      RewardModelConfig.register_subclass("robometer") and selected as `reward_model.type=robometer` (not
      --policy.type). Inference-only in LeRobot (no training or preference-pair training). Ships a
      compute_rabc_weights module for offline progress labelling.
    source_ref: ev-lerobot-robometer-config
checkpoints:
  - hub_id: lerobot/Robometer-4B
    note: "Published ROBOMETER checkpoint used by the LeRobot integration (Hub license tag apache-2.0)."
observation_space:
  cameras: {min: 1, max: 1}
  state: not used (video + task description only)
  language: required
  source_ref: ev-lerobot-robometer-docs-inputs
notes: >-
  in_grid false: reward model, not a robot-control policy. reward_output="progress" (default) returns last-frame
  progress clamped to [0, 1]; "success" returns a thresholded last-frame success. Default 8 frames from one
  configured camera key (image_key, default observation.images.top). The docs strongly recommend GPU inference but give
  no VRAM figure; params not stated as an exact total. Upstream robometer/robometer code: no license detected by the
  GitHub API on 2026-10-24.
verified_on: 2026-10-24
sources:
