id: vla-jepa
name: VLA-JEPA
aliases: [vla_jepa, VLAJEPA, ginwind/VLA-JEPA]
family: vla
summary: >-
  Vision-language-action model that pairs a Qwen3-VL-2B backbone with a flow-matching DiT action head, and adds a
  V-JEPA2 latent video world model as an auxiliary self-supervised loss during training only. At inference only Qwen
  and the action head run, predicting 7-step action chunks.
authors: Jingwen Sun et al. (University of Science and Technology of China and collaborators)
paper_url: https://arxiv.org/abs/2602.10098
backbone: Qwen3-VL-2B-Instruct + DiT-B flow-matching action head (V-JEPA2 world model, training only)
action_output: flow-matching
action_chunking: true
arch_source_ref: ev-lerobot-vlajepa-docs
license: Apache-2.0
weights_license: Apache-2.0
open_weights: true
frameworks:
  lerobot:
    support: native
    since: "0.6.0"
    policy_type: vla_jepa
    docs_url: https://huggingface.co/docs/lerobot/vla_jepa
    note: "Added in v0.6.0 (\"feat(policies): add VLA-JEPA\"). Default chunk_size 7, 4 Euler denoising steps."
    source_ref: ev-lerobot-vlajepa-config
checkpoints:
  - hub_id: lerobot/VLA-JEPA-Pretrain
    note: "Converted from ginwind/VLA-JEPA; DROID 1.0.1, 2 exterior views, 7-dim actions."
  - hub_id: lerobot/VLA-JEPA-LIBERO
    note: "LIBERO-10; 2 cameras (agentview + wrist), 7-dim actions."
  - hub_id: lerobot/VLA-JEPA-SimplerEnv
    note: "OXE Bridge / RT-1; 1 view duplicated x2, 7-dim actions."
  - hub_id: ginwind/VLA-JEPA
    note: "Original upstream release (Apache-2.0)."
observation_space:
  state: proprioceptive state via the action head's state encoder
  language: required
  source_ref: ev-lerobot-vlajepa-docs
notes: >-
  Family vla rather than world-model: the LeRobot docs call it a Vision-Language-Action model, and the V-JEPA2 world
  model is a training-time auxiliary loss that is not used at inference. Released checkpoints use 1–2 camera views;
  datasets with more views pass all views to Qwen but only the first `jepa_tubelet_size` (default 2) to the world
  model, so no hard camera max is stated. Params not stated as a total by the authors; not in the LeRobot compute
  hardware guide (requirements unset); not named by the RTC or PEFT docs. The LeRobot docs' LIBERO results table at
  v0.6.1 is internally inconsistent (e.g. libero_10 "96" successes of 100 shown as 93.0%).
verified_on: 2026-10-24
