id: aloha
name: ALOHA (stationary)
maker: Stanford (Tony Z. Zhao et al.); kits sold by Trossen Robotics
aliases: [ALOHA, ALOHA 2, Aloha stationary, aloha_static, viperx]
class: bimanual
summary: >-
  Low-cost open-source bimanual teleoperation rig: two ViperX follower arms, two WidowX leader arms and four cameras.
  ACT was introduced on it. LeRobot hosts real and simulated ALOHA datasets and ACT checkpoints, but native robot
  control was removed in 0.4.0. Only a single-arm `viperx` type ever shipped in a release (0.3.2–0.3.3).
dof: 6
dof_note: >-
  Per follower arm (ViperX): waist, shoulder, elbow, forearm_roll, wrist_angle, wrist_rotate + gripper. Shoulder and
  elbow each have a second "shadow" motor, so LeRobot's viperx type drives 9 motors.
arms: 2
actuators: "Dynamixel XM540-W270 (waist to wrist_angle) and XM430-W350 (wrist_rotate, gripper) on the ViperX follower"
specs_source_ref: ev-lerobot-viperx-motors
open_source: true
license: MIT (ALOHA codebase)
homepage: https://tonyzhaozh.github.io/aloha/
frameworks:
  lerobot:
    support: removed
    since: "0.3.2"
    until: "0.3.3"
    robot_type: [viperx]
    note: >-
      On main a 4-arm `aloha` robot type existed from Sep 2024 (PR #316) until the Hardware API redesign (PR #777,
      2025-06-05), but neither landed in a PyPI release. 0.3.2–0.3.3 shipped only the single-arm `viperx` follower
      (its README still showed the old --robot.type=aloha) plus a `widowx` teleoperator. Both were deprecated in 0.4.0
      (PR #2205). LeRobot v0.6.1 has no ALOHA robot type. ALOHA-format datasets and ACT checkpoints remain usable for
      training. Trossen's lerobot_trossen plugin covers its newer WidowX AI "ALOHA-style" kits (see trossen-widowx),
      not the original ViperX/WidowX ALOHA.
    source_ref: ev-lerobot-v040-deprecate
sensors_builtin: [rgb-multi]
teleop_options: ["Two WidowX leader arms (original ALOHA puppeteering)"]
notes: >-
  in_grid because large public LeRobot-format ALOHA data exists: lerobot/aloha_static_* (15 real-robot datasets
  listed on the Hub on 2026-10-24) and lerobot/aloha_sim_*. There are also official ACT checkpoints
  (lerobot/act_aloha_sim_transfer_cube_human, lerobot/act_aloha_sim_insertion_human). Rows for this robot reflect
  dataset/checkpoint compatibility, not live control in current LeRobot.
verified_on: 2026-10-24
