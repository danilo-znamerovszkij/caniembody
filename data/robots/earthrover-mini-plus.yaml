id: earthrover-mini-plus
name: EarthRover Mini Plus
maker: FrodoBots
aliases: [Earth Rover Mini Plus, EarthRover Mini+, Earth Rover MINI+, earthrover_mini_plus, FrodoBots EarthRover]
class: mobile-base
summary: >-
  Small four-wheel-drive outdoor rover from FrodoBots with front and rear cameras. It has no arm. LeRobot connects to
  it through the cloud using the FrodoBots Earth Rovers SDK, which must be running locally, and it is driven by
  keyboard for navigation datasets.
arms: 0
open_source: true
homepage: https://github.com/frodobots-org/earth-rovers-sdk
frameworks:
  lerobot:
    support: native
    since: "0.4.3"
    robot_type: [earthrover_mini_plus]
    docs_url: https://huggingface.co/docs/lerobot/earthrover_mini_plus
    note: >-
      Requires the FrodoBots SDK server (earth-rovers-sdk) and SDK credentials from FrodoBots. Teleop is
      --teleop.type=keyboard_rover. Added in PR #2575 (the earlier PR #2544 was reverted).
    source_ref: ev-lerobot-earthrover-src
teleop_options: ["Keyboard, WASD (keyboard_rover)"]
notes: >-
  Per the FrodoBots SDK README, the MINI+ has two cameras (front and rear, 1080p sensors streamed at 1024x576 and
  480x270), an MPU6050 IMU, two motors with four-wheel drive, 1.4 kg weight, 4 km/h top speed and a 12 km range.
  Hardware sources, firmware and 3D-print files are in FrodoBots' earth-rover-mini repository, where GitHub detects
  no license file, so the license is left blank. No camera preset in this matrix matches a front+rear rover pair.
  Price is not recorded because the FrodoBots shop is not machine-readable.
verified_on: 2026-10-24
