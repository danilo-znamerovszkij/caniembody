id: hope-jr
name: HopeJR
maker: TheRobotStudio (with Hugging Face)
aliases: [HOPEJr, Hope Jr, HopeJr arm, hope_jr_arm, hope_jr_hand]
class: arm
summary: >-
  Open-source DIY humanoid project from TheRobotStudio. LeRobot integrates its 7-motor arm and its tendon-driven
  dexterous hand as two separate robots. Both are teleoperated with the Homunculus exoskeleton and glove.
dof: 7
dof_note: "Arm: 7 motors (shoulder pitch/yaw/roll, elbow flex, wrist roll/yaw/pitch). The hand is a separate robot with 16 actuators."
arms: 1
actuators: >-
  Arm: 1x SM8512BL (shoulder pitch) + 6x Feetech STS3250. Hand: 16x Feetech SCS0009 micro servos.
specs_source_ref: ev-lerobot-hopejr-arm
open_source: true
homepage: https://github.com/TheRobotStudio/HOPEJr
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    robot_type: [hope_jr_arm, hope_jr_hand]
    docs_url: https://huggingface.co/docs/lerobot/hope_jr
    note: >-
      Arm and hand are separate robot types, teleoperated by homunculus_arm and homunculus_glove. Install extra:
      pip install -e ".[hopejr]". Added in PR #935, before the first tagged release (0.3.2).
    source_ref: ev-lerobot-hopejr-config
teleop_options: ["Homunculus exoskeleton arm (homunculus_arm)", "Homunculus glove (homunculus_glove)"]
notes: >-
  The maker repo contains both a full-humanoid design (Humanoid/) and the arm, hand and exoskeleton work integrated
  with LeRobot (Arm/). LeRobot only integrates the arm and hand, not the full humanoid. GitHub detects no license file
  in the HOPEJr repo, so the license is left blank.
verified_on: 2026-10-24
sources:
  - id: ev-lerobot-readme
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/README.md
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "LeRobot README lists HopeJR among natively supported hardware."
    quote: "SO100, LeKiwi, Koch, HopeJR, OMX, EarthRover, Reachy2, Gamepads, Keyboards, Phones, OpenARM, Unitree G1, reBot B601."
  - id: ev-lerobot-hopejr-doc
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/hope_jr.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "HopeJR guide: separate calibration/teleop for hand (glove) and arm (exoskeleton)."
    quote: "Run this script to find the USB ports for the arm, hand, glove, and exoskeleton:"
  - id: ev-lerobot-hopejr-config
    tier: upstream-documented
