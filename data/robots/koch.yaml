id: koch
name: Koch v1.1
maker: Alexander Koch (original design); v1.1 revision by Jess Moss
aliases: [Koch arm, Koch v1.1, low_cost_robot, Low-Cost Robot Arm, koch_follower, koch_leader]
class: arm
summary: >-
  Low-cost open-source arm with five joints plus a gripper, built from ROBOTIS Dynamixel XL430 and XL330 servos.
  Koch v1.1 is Jess Moss's revision of Alexander Koch's original design to make assembly easier. LeRobot supports it
  natively as a leader/follower pair.
dof: 5
dof_note: "Six motors per follower: shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll + gripper."
arms: 1
actuators: >-
  Follower: 2x Dynamixel XL430-W250 (shoulder) + 4x XL330-M288. Leader (v1.1 BOM): 6x Dynamixel XL330-M077-T.
specs_source_ref: ev-lerobot-koch-motors
open_source: true
license: Apache-2.0 (Koch v1.1 repo); MIT (original low_cost_robot repo)
bom_url: https://github.com/jess-moss/koch-v1-1
homepage: https://github.com/jess-moss/koch-v1-1
price_usd:
  low: 278
  high: 477
  note: >-
    Self-sourced parts cost from the Koch v1.1 README (US links): follower arm $278, leader arm $199, so $477 for the
    pair. Excludes 3D printing.
  source_ref: ev-koch-v11-bom
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    robot_type: [koch_follower]
    docs_url: https://huggingface.co/docs/lerobot/koch
    note: "Leader: --teleop.type=koch_leader. Needs the Dynamixel extra (pip install -e \".[dynamixel]\")."
    source_ref: ev-lerobot-koch-src
sensors_supported: [rgb-mono, rgb-dual, rgb-multi, realsense-depth]
teleop_options: ["Koch leader arm (koch_leader)"]
notes: >-
  LeRobot's Koch docs link to the v1.1 repo (jess-moss/koch-v1-1) for sourcing and assembly. Before the v0.3 hardware
  API redesign, main also had a koch_bimanual type. Bimanual Koch is not registered in v0.6.1.
verified_on: 2026-10-24
sources:
