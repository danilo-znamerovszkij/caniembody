  - id: ev-hub-aloha-mobile
    tier: community-reported
    type: hub-checkpoint
    url: https://huggingface.co/datasets/lerobot/aloha_mobile_cabinet
    verified_on: 2026-10-24
    summary: "Mobile ALOHA dataset in the lerobot Hub org (six aloha_mobile_* tasks listed via Hub API, 2026-10-24)."
  - id: ev-mobile-aloha-repo
    tier: upstream-documented
    type: vendor-docs
    url: https://github.com/MarkFzp/mobile-aloha/blob/0e403249c76054a68e757e590d4da4dba401c9e3/README.md
    verified_on: 2026-10-24
    summary: "Mobile ALOHA codebase: forked from ALOHA, teleop + data collection, ROS 1."
    quote: "This codebase is forked from the [ALOHA repo](https://github.com/tonyzhaozh/aloha), and contains implementation for teleoperation and data collection with the Mobile ALOHA hardware."
