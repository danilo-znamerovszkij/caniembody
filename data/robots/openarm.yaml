id: openarm
name: OpenArm
maker: Enactic
aliases: [OpenArm 2.0, OpenArms, openarm_follower, bi_openarm_follower]
class: bimanual
summary: >-
  Open-source, human-scale 7-DoF arm from Enactic with backdrivable quasi-direct-drive Damiao motors on CAN-FD. It is
  usually built as a bimanual pair. LeRobot supports single-arm and bimanual setups natively, on Linux only.
dof: 7
dof_note: "Per arm, plus a parallel gripper (8 motors per arm in LeRobot's config)."
arms: 2
actuators: "Damiao QDD motors over CAN-FD: DM8009 (J1-J2), DM4340 (J3-J4), DM4310 (J5-J7 + gripper)"
payload_g: {min: 4100, max: 6000}
specs_source_ref: ev-openarm-docs
open_source: true
license: Apache-2.0
bom_url: https://docs.openarm.dev/
homepage: https://openarm.dev
frameworks:
  lerobot:
    support: native
    since: "0.4.4"
    robot_type: [openarm_follower, bi_openarm_follower]
    docs_url: https://huggingface.co/docs/lerobot/openarm
    note: >-
      Leader: openarm_leader / bi_openarm_leader. An OpenArm Mini leader was also added in 0.4.4. Linux only, because
      the CAN USB adapter has no macOS driver. Single-arm (PR #2795) and bimanual (PR #2835) types were both first
      released in 0.4.4.
    source_ref: ev-lerobot-openarm-src
sensors_supported: [rgb-mono, rgb-dual, rgb-multi, realsense-depth]
teleop_options: ["OpenArm leader (openarm_leader / bi_openarm_leader)", "OpenArm Mini leader"]
notes: >-
  Payload per Enactic: 4.1 kg nominal (held 1 min in worst posture) and 6.0 kg peak (3 s move + 1 s hold) per arm.
  The LeRobot docs cite $6,500 USD for a complete bimanual system. That figure is not on the maker's own page and is
  not recorded as a price. OpenArm is sold as a DIY kit or assembled through verified manufacturers.
verified_on: 2026-10-24
sources:
