id: so100
name: SO-100
maker: TheRobotStudio (designed in collaboration with Hugging Face)
aliases: [SO-ARM100, SO100, SO-100 arm, Standard Open Arm 100, so100_follower, so100_leader]
class: arm
summary: >-
  The first-generation low-cost, open-source 3D-printed arm from TheRobotStudio and Hugging Face. It has five joints
  plus a gripper and uses Feetech STS3215 servos. The maker now marks the SO-100 docs as deprecated in favour of the
  SO-101, but LeRobot still supports it natively.
dof: 5
dof_note: "Six servos per follower: shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll + gripper."
arms: 1
actuators: Feetech STS3215 serial bus servos (6 per arm)
specs_source_ref: ev-lerobot-so-follower-motors
open_source: true
license: Apache-2.0
bom_url: https://github.com/TheRobotStudio/SO-ARM100/blob/main/SO100.md
homepage: https://github.com/TheRobotStudio/SO-ARM100
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    robot_type: [so100_follower]
    docs_url: https://huggingface.co/docs/lerobot/so100
    note: >-
      Leader: --teleop.type=so100_leader. 0.3.x also registered so100_follower_end_effector, which is gone from 0.4.0.
      Since 0.4.3 the so100_follower type is registered by the shared so_follower module (PR #2763), which merged the
      SO-100 and SO-101 code. The type string did not change. SO-100 support was added on main in Oct 2024 (PR #419),
      after the only earlier PyPI release (0.1.0, 2024-03-09), so 0.3.2 is the first release that includes it.
    source_ref: ev-lerobot-so-follower-src
sensors_supported: [rgb-mono, rgb-dual, rgb-multi, realsense-depth]
teleop_options: ["SO-100 leader arm (so100_leader)"]
notes: >-
  The SO-101 is the maker's recommended successor. Its improvements are better wiring, easier assembly (no gear
  removal) and updated motors. LeRobot drives both arms with the same code.
verified_on: 2026-10-24
sources:
