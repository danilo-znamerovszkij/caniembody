    summary: "so_follower config registers both so101_follower and so100_follower robot types."
    quote: "@RobotConfig.register_subclass(\"so101_follower\") @RobotConfig.register_subclass(\"so100_follower\")"
  - id: ev-lerobot-so-follower-motors
    tier: upstream-documented
