id: so101
name: SO-101
maker: TheRobotStudio (designed in collaboration with Hugging Face)
aliases: [SO-ARM101, SO101, SO-101 arm, so101_follower, so101_leader]
class: arm
summary: >-
  Low-cost, open-source 3D-printed arm with five joints plus a gripper, driven by six Feetech STS3215 serial bus servos.
  It is the successor to the SO-100, and the LeRobot docs call it their flagship robot. It is normally built as a
  leader/follower pair for teleoperation.
dof: 5
dof_note: "Six servos per follower: shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll + gripper."
arms: 1
actuators: >-
  Feetech STS3215 (follower: 6x, 1/345 gearing; leader: mixed 1/345, 1/191 and 1/147 gearing so it can be back-driven
  by hand).
specs_source_ref: ev-lerobot-so101-doc
open_source: true
license: Apache-2.0
bom_url: https://github.com/TheRobotStudio/SO-ARM100#sourcing-parts
homepage: https://github.com/TheRobotStudio/SO-ARM100
price_usd:
  low: 121.94
  high: 229.88
  note: >-
    Self-sourced parts cost from the maker's README (US links): $121.94 for one follower arm, $229.88 for a
    leader + follower pair. Excludes 3D-printed parts, shipping and tax. Assembled arms and kits are sold by
    third-party vendors listed in the README, at their own prices (not recorded here).
  source_ref: ev-soarm-readme-bom
frameworks:
  lerobot:
    support: native
    since: "0.3.2"
    robot_type: [so101_follower]
    docs_url: https://huggingface.co/docs/lerobot/so101
    note: >-
      Leader: --teleop.type=so101_leader. Since 0.4.3 the type is registered by the shared so_follower module, which
      merged the separate SO-100 and SO-101 implementations (PR #2763). The type string did not change. 0.3.2 is the
      first tagged release, and the only earlier PyPI release (0.1.0, 2024-03-09) predates all real-robot support.
    source_ref: ev-lerobot-so-follower-src
sensors_supported: [rgb-mono, rgb-dual, rgb-multi, realsense-depth]
teleop_options: ["SO-101 leader arm (so101_leader)"]
notes: >-
  LeRobot cameras are configured per robot (`cameras:` dict). OpenCV and Intel RealSense (with depth) are the built-in
  camera backends.
verified_on: 2026-10-24
sources:
  - id: ev-lerobot-readme
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/README.md
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "LeRobot README lists natively supported hardware."
    quote: "SO100, LeKiwi, Koch, HopeJR, OMX, EarthRover, Reachy2, Gamepads, Keyboards, Phones, OpenARM, Unitree G1, reBot B601."
  - id: ev-lerobot-so101-doc
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/so101.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "SO-101 assembly guide: follower uses 6 STS3215 motors (1/345); leader uses three gear ratios."
    quote: "The follower arm uses 6x STS3215 motors with 1/345 gearing. The leader, however, uses three differently geared motors"
  - id: ev-lerobot-so-follower-src
    tier: upstream-documented
    type: source-code
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/src/lerobot/robots/so_follower/config_so_follower.py
    date: 2026-08-03
    verified_on: 2026-10-24
