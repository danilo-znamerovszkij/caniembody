    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "Motor map: five arm joints plus gripper, all sts3215."
    quote: "\"wrist_roll\": Motor(5, \"sts3215\", norm_mode_body), \"gripper\": Motor(6, \"sts3215\", MotorNormMode.RANGE_0_100),"
  - id: ev-lerobot-v032-so101
