id: trossen-widowx
name: Trossen WidowX AI
maker: Trossen Robotics
aliases: [WidowX AI, Trossen AI, widowxai_follower_robot, bi_widowxai_follower_robot, Trossen AI Stationary, Trossen AI Mobile]
class: arm
summary: >-
  Trossen Robotics' 6-DoF WidowX AI arm, the arm used in its ALOHA-style "Trossen AI" kits (single arm, stationary
  bimanual, mobile). LeRobot supports it through Trossen's own plugin (lerobot_trossen). The classic Interbotix WidowX
  250 used as the leader of the original ALOHA is a different arm and is not covered by this plugin.
dof: 6
payload_g: {max: 1500}
repeatability_mm: {max: 1}
specs_source_ref: ev-trossen-wxai
open_source: false
homepage: https://www.trossenrobotics.com/widowx-ai
price_usd:
  low: 4545.95
  note: "WidowX AI 'Base' configuration (follower, precision grip end-effector) on Trossen's store page."
  source_ref: ev-trossen-wxai-price
frameworks:
  lerobot:
    support: plugin
    robot_type: [widowxai_follower_robot, bi_widowxai_follower_robot, mobileai_robot]
    package: lerobot_robot_trossen
    repo_url: https://github.com/TrossenRobotics/lerobot_trossen
    docs_url: https://docs.trossenrobotics.com/trossen_arm/main/tutorials/lerobot_plugin.html
    note: >-
      Vendor-maintained plugin. Leaders: widowxai_leader_teleop / bi_widowxai_leader_teleop / mobileai_leader_teleop.
      Requires Python >=3.12 and lerobot>=0.6.0. Installed with `uv sync` from the repo, since it is not on PyPI as of
      2026-10-24. LeRobot's own native widowx teleoperator (classic WidowX) was deprecated in 0.4.0.
    source_ref: ev-trossen-plugin-readme
sensors_supported: [rgb-mono, rgb-dual, rgb-multi, realsense-depth]
teleop_options: ["WidowX AI leader arm (widowxai_leader_teleop)"]
notes: "Trossen spec: payload 1.5 kg, reach 700 mm, 6 DoF, repeatability 1 mm, weight 4 kg."
verified_on: 2026-10-24
sources:
  - id: ev-lerobot-third-party
    tier: upstream-documented
    type: official-docs
    url: https://github.com/huggingface/lerobot/blob/v0.6.1/docs/source/third_party_robots.mdx
    date: 2026-08-03
    verified_on: 2026-10-24
    versions: {lerobot: "0.6.1"}
    summary: "LeRobot third-party page lists lerobot_trossen for WidowX and ALOHA-style arms."
    quote: "Plugin for the WidowX and ALOHA-style arms from"
