id: unitree-g1
name: Unitree G1
maker: Unitree Robotics
aliases: [G1, G1 EDU, Unitree G1 EDU, unitree_g1]
class: humanoid
summary: >-
  Unitree's 1.32 m bipedal humanoid, about 35 kg, with 23 to 43 joints depending on version. In LeRobot, the lower
  body is driven by a pretrained RL locomotion controller (GR00T-WholeBodyControl or Holosoma). Data recording and
  learned policies (e.g. π0.5 with RTC) target upper-body loco-manipulation, teleoperated with the Homunculus
  exoskeleton and a joystick.
dof: 7
dof_note: >-
  LeRobot config assumes the 29-joint layout: per arm 4 (shoulder pitch/roll/yaw, elbow) + 3 wrist (roll/pitch/yaw).
  Unitree's base G1 (23 DoF) lists 5 DoF per arm. LeRobot docs state that both 29- and 23-DoF variants are supported.
arms: 2
actuators: "Low-inertia internal-rotor PMSM joint motors, dual encoders (per Unitree)"
payload_g: {max: 3000}
specs_source_ref: ev-unitree-g1-page
open_source: false
homepage: https://www.unitree.com/g1/
price_usd:
  low: 13500
  note: >-
    Base G1, tax and shipping excluded, per Unitree. The G1 EDU, the version Unitree lists with secondary-development
    support, is "Contact sales".
  source_ref: ev-unitree-g1-price
frameworks:
  lerobot:
    support: native
    since: "0.4.3"
    robot_type: [unitree_g1]
    docs_url: https://huggingface.co/docs/lerobot/unitree_g1
    note: >-
      Uses unitree_sdk2_python over a ZMQ bridge, with run_g1_server.py on the robot. Locomotion comes from a
      pretrained lower-body controller (--robot.controller=GrootLocomotionController or HolosomaLocomotionController)
      steered by gamepad. Loco-manipulation teleop uses the Homunculus exoskeleton (--teleop.type=unitree_g1). MuJoCo
      sim via --robot.is_simulation=true. Docs show π0.5 fine-tuning and RTC inference via lerobot-rollout. Base
      support arrived in 0.4.3 (PR #2530), and the whole-body-control implementation in 0.5.0 (PR #2876). Arm IK needs
      pinocchio from conda-forge.
    source_ref: ev-lerobot-g1-doc
sensors_builtin: [mic-array]
teleop_options: ["Homunculus exoskeleton, 7-DoF arms (unitree_g1 teleoperator)", "Gamepad/joystick for locomotion"]
notes: >-
  Unitree marks secondary development as available only on the G1 EDU ("/" for base G1), so low-level SDK control as
  used by LeRobot implies the EDU. Built-in sensing per Unitree: depth camera + 3D LiDAR + 4-mic array. LeRobot reads
  the head camera through ZMQ. Arm maximum load is about 2 kg (G1) or 3 kg (G1 EDU) and varies greatly with arm
  posture.
verified_on: 2026-10-24
sources:
