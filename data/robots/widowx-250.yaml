id: widowx-250
name: WidowX 250 S
maker: Trossen Robotics (Interbotix X-Series)
aliases: [WidowX 250, WidowX 250 S, WidowX-250 6DOF, wx250s, Interbotix WidowX 250, Bridge WidowX]
class: arm
summary: >-
  Trossen Robotics' Interbotix X-Series 6-DoF Dynamixel arm, now discontinued. It is the robot used for BridgeData V2,
  and the "WidowX" in OpenVLA, X-VLA and EO-1 real-robot results refers to this setup. It is not the Trossen WidowX AI
  (trossen-widowx). LeRobot shipped a native `widowx` teleoperator for this arm (the ALOHA leader role) until 0.3.3 and
  has never had a follower robot type for it. Policies are usually deployed through the BridgeData WidowX controller
  stack (rail-berkeley/bridge_data_robot) or Trossen's ROS packages.
dof: 6
payload_g: {max: 250}
repeatability_mm: {max: 1}
specs_source_ref: ev-trossen-wx250s-spec
open_source: false
homepage: https://www.trossenrobotics.com/widowx-250
frameworks:
  lerobot:
    support: removed
    until: "0.3.3"
    note: >-
      Only a teleoperator (`--teleop.type=widowx`, leader arm) was ever native. There was no follower robot type, so
      LeRobot could not run a policy on it. Deprecated in 0.4.0.
    source_ref: ev-lerobot-v033-widowx
  ros2:
    support: upstream-repo
    repo_url: https://github.com/Interbotix/interbotix_ros_manipulators
    docs_url: https://docs.trossenrobotics.com/interbotix_xsarms_docs/ros2_packages.html
    note: "Trossen's Interbotix X-Series ROS 2 packages (control, MoveIt 2, simulation)."
    source_ref: ev-trossen-ros2
notes: >-
  Not the Trossen WidowX AI (trossen-widowx). Evidence for one does not transfer to the other. Trossen spec: 6 DoF,
  650 mm reach, 1 mm repeatability, 5-8 mm accuracy, 250 g working payload. Trossen's product page marks the WidowX 250 S as
  discontinued. Results on the Bridge "WidowX" in SimplerEnv are simulation, not real-robot, evidence.
verified_on: 2026-10-24
